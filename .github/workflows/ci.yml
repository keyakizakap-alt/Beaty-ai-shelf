name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小権限：リポジトリの読み取りのみ
permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 依存ライブラリの既知の脆弱性（中程度以上）があれば失敗させる
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      # next typegen で Next.js の型定義を生成してから型検査する（生成物は Git に含めない）
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
